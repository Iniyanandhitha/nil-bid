{% load<!-- Auction Card -->
<div
    class="glass-panel rounded-2xl overflow-hidden group hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-1 relative border border-white/60">
    <div class="relative">
        <a href="{% url 'auction_detail' auction.pk %}">
            <div class="aspect-w-16 aspect-h-10 bg-slate-100 overflow-hidden">
                {% if auction.image %}
                <img src="{{ auction.image.url }}" alt="{{ auction.name }}"
                    class="object-cover w-full h-full transform group-hover:scale-110 transition-transform duration-700">
                {% else %}
                <div class="flex items-center justify-center h-full text-slate-300 bg-slate-50">
                    <i class="fas fa-image text-4xl"></i>
                </div>
                {% endif %}

                <!-- Overlay Gradient -->
                <div
                    class="absolute inset-0 bg-gradient-to-t from-slate-900/40 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                </div>
            </div>
        </a>

        <!-- Status Badge -->
        <div class="absolute top-3 right-3">
            {% if auction.is_closed %}
            <span
                class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-red-100 text-red-800 shadow-sm border border-red-200">
                Closed
            </span>
            {% else %}
            <span
                class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 shadow-sm border border-emerald-200 animate-pulse">
                Active
            </span>
            {% endif %}
        </div>
    </div>

    <div class="p-5">
        <div class="flex justify-between items-start mb-2">
            <h3 class="text-lg font-bold text-slate-800 line-clamp-1 group-hover:text-fuchsia-600 transition-colors">
                <a href="{% url 'auction_detail' auction.pk %}">{{ auction.name }}</a>
            </h3>
        </div>

        <p class="text-slate-500 text-sm mb-4 line-clamp-2 font-medium">{{ auction.description }}</p>

        <div class="flex items-center justify-between border-t border-slate-100 pt-4 mt-2">
            <div>
                <p class="text-xs text-slate-400 uppercase font-semibold">Base Price</p>
                <p
                    class="text-lg font-bold text-transparent bg-clip-text bg-gradient-to-r from-fuchsia-600 to-indigo-600">
                    ${{ auction.base_price }}</p>
            </div>
            <div class="text-right">
                <p class="text-xs text-slate-400 uppercase font-semibold">Bids</p>
                <div class="flex items-center justify-end gap-1">
                    <i class="fas fa-shield-alt text-xs text-indigo-400"></i>
                    <span class="text-sm font-bold text-slate-700">{{ auction.bid_count }}</span>
                </div>
            </div>
        </div>

        <div class="mt-4 pt-3 flex items-center justify-between">
            <a href="{% url 'auction_detail' auction.pk %}"
                class="w-full text-center py-2.5 rounded-xl text-sm font-semibold text-white bg-gradient-to-r from-fuchsia-500 to-indigo-500 hover:from-fuchsia-600 hover:to-indigo-600 shadow-md hover:shadow-lg transition-all transform active:scale-95">
                Place Secure Bid
            </a>
        </div>
    </div>
</div>
