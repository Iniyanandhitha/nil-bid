{% load static tailwind_tags %}

<!-- Header -->
<header class="sticky top-0 z-50 transition-all duration-300">
    <div class="glass-panel mx-4 mt-4 rounded-2xl px-6 py-3 flex items-center justify-between">
        <!-- Logo -->
        <a href="{% url 'home' %}" class="flex items-center gap-2 group">
            <div
                class="relative w-8 h-8 flex items-center justify-center bg-gradient-to-tr from-fuchsia-400 to-indigo-400 rounded-lg shadow-lg group-hover:rotate-12 transition-transform">
                <i class="fas fa-gavel text-white text-sm"></i>
                <div class="absolute -top-1 -right-1 w-3 h-3 bg-yellow-300 rounded-full animate-pulse"></div>
            </div>
            <span
                class="text-xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-slate-800 to-slate-600 tracking-tight">
                Bid<span class="text-fuchsia-500">Secure</span>
            </span>
        </a>

        <!-- Navigation -->
        <nav class="hidden md:flex items-center gap-8">
            <a href="{% url 'home' %}"
                class="text-sm font-semibold text-slate-600 hover:text-fuchsia-500 transition-colors">Home</a>
            <a href="{% url 'auctions' %}"
                class="text-sm font-semibold text-slate-600 hover:text-fuchsia-500 transition-colors">Auctions</a>
            <a href="#" class="text-sm font-semibold text-slate-600 hover:text-fuchsia-500 transition-colors">About</a>
        </nav>

        <!-- Right Side Actions -->
        <div class="flex items-center gap-4">
            <!-- Search Icon (Mobile) -->
            <button class="md:hidden text-slate-500 hover:text-slate-800">
                <i class="fas fa-search"></i>
            </button>

            {% if user.is_authenticated %}
            <div class="flex items-center gap-3">
                <span class="text-sm font-medium text-slate-600 hidden sm:block">
                    Hello, <span class="text-indigo-600 font-bold">{{ user.username }}</span>
                </span>
                <a href="{% url 'logout' %}"
                    class="text-sm font-semibold text-slate-500 hover:text-red-500 transition-colors">
                    Logout
                </a>
                {% if user.is_auctioner %}
                <a href="{% url 'create_auction' %}"
                    class="glass-btn px-4 py-2 rounded-xl text-sm flex items-center gap-2">
                    <i class="fas fa-plus"></i> <span class="hidden sm:inline">Create</span>
                </a>
                {% endif %}
            </div>
            {% endif %}
        </div>
    </div>
</header>
